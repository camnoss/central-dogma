apiVersion: apps/v1
kind: Deployment
metadata:
  name: greeting
  labels:
    app.kubernetes.io/name: greeting
    backstage.io/kubernetes-id: greeting
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: greeting
  template:
    metadata:
      labels:
        app.kubernetes.io/name: greeting
        backstage.io/kubernetes-id: greeting
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: app
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
