# The registry validates CI tokens with the Kubernetes TokenReview API, so its
# pods run as this ServiceAccount, bound to system:auth-delegator.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nerv-registry
  namespace: kafka
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nerv-registry-token-review
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: nerv-registry
    namespace: kafka
