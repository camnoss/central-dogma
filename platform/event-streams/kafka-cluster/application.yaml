# nerv-kafka: the KRaft Kafka cluster behind Nerv event streams.
#
# base/ holds the production sizing (3 brokers, replication factor 3). Geofront
# is a local kind cluster today, so this Application deploys overlays/dev
# (1 broker, replication factor 1). A production Geofront points at base/.
#
# The file is named application.yaml so the root app picks it up.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka-cluster
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/camnoss/central-dogma
    targetRevision: main
    path: platform/event-streams/kafka-cluster/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: kafka
  syncPolicy:
    automated:
      # Never prune: deleting the Kafka resource deletes the cluster and every
      # topic in it.
      prune: false
      selfHeal: true
