apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Single-broker cluster for the local Geofront (kind). Replication factor 1
# everywhere, including the stream topics, which inherit the broker defaults.
resources:
  - ../../base
patches:
  - target:
      kind: KafkaNodePool
      name: dual-role
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/storage/volumes/0/size
        value: 10Gi
      - op: replace
        path: /spec/resources
        value:
          requests:
            cpu: 200m
            memory: 1Gi
          limits:
            memory: 1Gi
  - target:
      kind: Kafka
      name: nerv-kafka
    patch: |-
      - op: replace
        path: /spec/kafka/config/default.replication.factor
        value: 1
      - op: replace
        path: /spec/kafka/config/min.insync.replicas
        value: 1
      - op: replace
        path: /spec/kafka/config/offsets.topic.replication.factor
        value: 1
      - op: replace
        path: /spec/kafka/config/transaction.state.log.replication.factor
        value: 1
      - op: replace
        path: /spec/kafka/config/transaction.state.log.min.isr
        value: 1
