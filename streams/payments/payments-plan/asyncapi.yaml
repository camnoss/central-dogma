asyncapi: 3.0.0
info:
  title: PaymentsPlan state
  version: 1.0.0
  description: >
    ECST snapshot of every payments-plan in the payments domain. CloudEvents 1.0.2,
    Kafka binding in binary content mode; the record value is Avro.
defaultContentType: application/avro
channels:
  paymentsPlanState:
    address: payments.payments-plan.state.v1
    messages:
      paymentsPlanState:
        name: PaymentsPlanState
        headers:
          type: object
          properties:
            ce_specversion: { type: string, const: "1.0" }
            ce_id: { type: string, description: "{paymentsPlanId}-{stateVersion}" }
            ce_source: { type: string, const: "urn:company:payments:customer-bill-state-projector" }
            ce_type: { type: string, const: "com.company.payments.paymentsplan.state.v1" }
            ce_subject: { type: string, description: paymentsPlanId }
            ce_time: { type: string, format: date-time }
            ce_partitionkey: { type: string, description: "paymentsPlanId, also the Kafka key" }
            content-type: { type: string, const: application/avro }
        payload:
          schemaFormat: application/vnd.apache.avro+json;version=1.9.0
          schema:
            $ref: ./schema/PaymentsPlanState.avsc
    bindings:
      kafka:
        partitions: 12
        replicas: 3
        topicConfiguration:
          cleanup.policy: [compact]
operations:
  publishPaymentsPlanState:
    action: send
    channel:
      $ref: '#/channels/paymentsPlanState'
